}
#divider{
  width:100%;height:1px;
  background:linear-gradient(to right,transparent,rgba(200,168,80,0.5),transparent);
  margin-bottom:2.8vh;
}
.msg-ja{
  font-family:'Noto Serif JP',serif;
  font-size:clamp(.9rem,1.9vw,1.2rem);
  color:rgba(238,231,216,0.92);
  letter-spacing:.12em;
  margin-bottom:.8vh;
}
.msg-en{
  font-family:'Cormorant Garamond','Noto Serif JP',serif;
  font-size:clamp(.75rem,1.6vw,1rem);
  color:rgba(238,231,216,0.72);
  letter-spacing:.18em;
  margin-bottom:.8vh;
}
.msg-ko{
  font-family:'Noto Sans JP',sans-serif;
  font-size:clamp(.8rem,1.7vw,1rem);
  color:rgba(238,231,216,0.72);
  letter-spacing:.08em;
  margin-bottom:0;
}
#x-link-wrap{
  margin-top:2.8vh;
  display:flex;align-items:center;gap:.8vw;
}
#x-link{
  font-family:'Noto Serif JP',serif;
  font-size:clamp(.75rem,1.5vw,.95rem);
  color:rgba(201,162,39,0.88);
  text-decoration:none;
  letter-spacing:.1em;
  border-bottom:1px solid rgba(201,162,39,0.4);
  padding-bottom:.2vh;
  transition:color .15s,border-color .15s;
}
#x-link:hover{color:rgba(230,195,110,1);border-color:rgba(230,195,110,0.8);}

/* character click */
#chr-left,#chr-right{cursor:pointer;transition:filter .18s;}
#chr-left:active,#chr-right:active{filter:brightness(1.1);}
/* dialogue window */
#dlg{
  display:none;position:absolute;bottom:0;left:0;right:0;
  height:36vh;padding:0 2vw 1.5vh;
  flex-direction:column;z-index:10;pointer-events:none;
}
#dlg.show{display:flex;pointer-events:auto;}
#dlg-name{
  font-family:'Noto Sans JP',sans-serif;font-weight:400;
  font-size:clamp(.8rem,2.2vw,1.3rem);padding:.15vh 1.7vw;letter-spacing:.1em;
  border-radius:5px 5px 0 0;border:3px solid #c8a830;border-bottom:none;
  align-self:flex-start;margin-left:1vw;white-space:nowrap;
  background:rgba(14,10,24,0.92);color:#f0eaf5;
}
#dlg-box{
  flex:1;background:rgba(14,10,24,0.95);
  border:3px solid #c8a830;border-radius:0 8px 8px 8px;
  padding:1.5vh 2vw 2.5vh;display:flex;align-items:center;cursor:pointer;
}
#dlg-text{
  font-family:'Noto Serif JP',serif;
  font-size:clamp(.8rem,2.2vw,1.3rem);color:#f0eaf5;
  line-height:1.85;letter-spacing:.04em;white-space:pre-wrap;
}
</style>
</head>
